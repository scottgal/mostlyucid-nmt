name: Build and Release Executables

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 3.2.0)'
        required: false
        default: 'dev'

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: mostlylucid-nmt-windows-x64.exe
            exe_name: mostlylucid-nmt.exe
          - os: ubuntu-latest
            asset_name: mostlylucid-nmt-linux-x64
            exe_name: mostlylucid-nmt
          - os: macos-latest
            asset_name: mostlylucid-nmt-macos-x64
            exe_name: mostlylucid-nmt

    steps:
      - name: Free disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
            sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
            sudo rm -rf /usr/share/swift /usr/local/share/powershell
            sudo docker image prune --all --force || true
            sudo apt-get clean || true
          fi
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # PyInstaller for building executables
          pip install pyinstaller

          # Install all requirements for the translation service
          pip install -r requirements.txt

      - name: Generate version string
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(date -u +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Update version in source
        shell: bash
        run: |
          echo '__version__ = "${{ steps.version.outputs.version }}"' > src/__version__.py

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller mostlylucid_nmt.spec --clean
          ls -la dist/

      - name: Test executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./dist/mostlylucid-nmt.exe --version || echo "Version check done"
          else
            chmod +x ./dist/mostlylucid-nmt
            ./dist/mostlylucid-nmt --version || echo "Version check done"
          fi

      - name: Get build size
        id: size
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            SIZE=$(du -sm dist/mostlylucid-nmt.exe | cut -f1)
          else
            SIZE=$(du -sm dist/mostlylucid-nmt | cut -f1)
          fi
          echo "size_mb=${SIZE}" >> $GITHUB_OUTPUT
          echo "Build size: ${SIZE} MB"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/mostlylucid-nmt${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7

      - name: Build summary
        run: |
          echo "### Build: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** ${{ matrix.asset_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ~${{ steps.size.outputs.size_mb }} MB (uncompressed)" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Run on tag pushes OR manual dispatch with non-dev version
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'dev')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls | head -50

      - name: Generate version string
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(date -u +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Creating release for version: ${VERSION}"

      - name: Prepare release files
        run: |
          mkdir -p release

          # Copy executables with proper names
          if [ -d "artifacts/build-windows-latest" ]; then
            cp artifacts/build-windows-latest/mostlylucid-nmt.exe release/mostlylucid-nmt-windows-x64.exe
          fi

          if [ -d "artifacts/build-ubuntu-latest" ]; then
            cp artifacts/build-ubuntu-latest/mostlylucid-nmt release/mostlylucid-nmt-linux-x64
            chmod +x release/mostlylucid-nmt-linux-x64
          fi

          if [ -d "artifacts/build-macos-latest" ]; then
            cp artifacts/build-macos-latest/mostlylucid-nmt release/mostlylucid-nmt-macos-x64
            chmod +x release/mostlylucid-nmt-macos-x64
          fi

          # Generate checksums
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MostlyLucid-NMT v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          body: |
            ## MostlyLucid-NMT v${{ steps.version.outputs.version }}

            **Neural machine translation** with Opus-MT, mBART50, and M2M100 models. Supports 150+ languages with automatic model fallback.

            ---

            ### Downloads

            | Platform | File | Size |
            |----------|------|------|
            | Windows | `mostlylucid-nmt-windows-x64.exe` | ~175MB |
            | Linux | `mostlylucid-nmt-linux-x64` | ~175MB |
            | macOS | `mostlylucid-nmt-macos-x64` | ~175MB |

            **Just download and run** - no Python, no installation, no dependencies required!

            > **Note:** These are CPU-only executables for maximum portability. For GPU acceleration, use [Docker images](https://hub.docker.com/r/scottgal/mostlylucid-nmt).

            ---

            ### Quick Start

            ```bash
            # Make executable (Linux/macOS)
            chmod +x mostlylucid-nmt-linux-x64

            # Direct translation
            ./mostlylucid-nmt translate "Hello world" --to de
            # Output: Hallo Welt

            # Pipe from stdin
            cat document.txt | ./mostlylucid-nmt translate --to fr

            # Start HTTP server with Swagger UI
            ./mostlylucid-nmt server
            # API docs at http://localhost:8000/docs
            ```

            ---

            ### CLI Commands

            | Command | Description |
            |---------|-------------|
            | `translate "text" --to de` | Direct translation (loads model on demand) |
            | `server` | Start HTTP API server with Swagger UI |
            | `server --background` | Run server as daemon |
            | `mcp` | MCP server for Claude Code / LLM integration |
            | `languages` | List all supported languages |
            | `status` | Check server health and cache info |
            | `info` | Show current configuration |
            | `--version` | Show version |

            ---

            ### MCP Integration (Claude Code)

            Add translation tools to your LLM workflow:

            ```json
            // ~/.claude/settings.json
            {
              "mcpServers": {
                "translate": {
                  "command": "mostlylucid-nmt",
                  "args": ["mcp"]
                }
              }
            }
            ```

            ---

            ### Model Families

            Models download automatically on first use:

            | Family | Download | Languages | Quality |
            |--------|----------|-----------|---------|
            | **Opus-MT** | ~300MB/pair | 150+ | Best |
            | **mBART50** | ~2.4GB | 50 | Good |
            | **M2M100** | ~2.2GB | 100 | Good |

            ```bash
            # Use specific model
            ./mostlylucid-nmt translate "Hello" --to zh --model m2m100
            ```

            ---

            ### GPU Acceleration (Docker)

            ```bash
            # GPU with CUDA 12.6
            docker run --gpus all -p 8000:8000 scottgal/mostlylucid-nmt:gpu

            # CPU Docker
            docker run -p 8000:8000 scottgal/mostlylucid-nmt:cpu
            ```

            ---

            ### Checksums

            SHA256 checksums are in `checksums.txt` for verification.

            ---

            **Full documentation:** [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) | [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
