name: Build and Release Executables

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 3.2.0)'
        required: false
        default: 'dev'

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: mostlylucid-nmt-windows-x64.zip
            exe_name: mostlylucid-nmt.exe
          - os: ubuntu-latest
            asset_name: mostlylucid-nmt-linux-x64.tar.gz
            exe_name: mostlylucid-nmt
          - os: macos-latest
            asset_name: mostlylucid-nmt-macos-x64.tar.gz
            exe_name: mostlylucid-nmt

    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove unnecessary large packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only for smaller size)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

          # Install CPU-only PyTorch (MUCH smaller than CUDA version)
          pip install torch --index-url https://download.pytorch.org/whl/cpu

          # Install other requirements (skip torch since we installed CPU version)
          pip install fastapi pydantic uvicorn gunicorn transformers langdetect sentencepiece sacremoses protobuf httpx tqdm psutil

      - name: Generate version string
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(date -u +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Update version in source
        shell: bash
        run: |
          echo '__version__ = "${{ steps.version.outputs.version }}"' > src/__version__.py

      - name: Build executable
        run: pyinstaller mostlylucid_nmt.spec

      - name: Test executable
        shell: bash
        run: |
          # onedir mode creates dist/mostlylucid-nmt/mostlylucid-nmt[.exe]
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./dist/mostlylucid-nmt/mostlylucid-nmt.exe --version || echo "Version check done"
            ./dist/mostlylucid-nmt/mostlylucid-nmt.exe info || echo "Info check done"
          else
            ./dist/mostlylucid-nmt/mostlylucid-nmt --version || echo "Version check done"
            ./dist/mostlylucid-nmt/mostlylucid-nmt info || echo "Info check done"
          fi

      - name: Get build size
        id: size
        shell: bash
        run: |
          SIZE=$(du -sm dist/mostlylucid-nmt | cut -f1)
          echo "size_mb=${SIZE}" >> $GITHUB_OUTPUT
          echo "Build size: ${SIZE} MB"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/mostlylucid-nmt -DestinationPath dist/${{ matrix.asset_name }}

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ${{ matrix.asset_name }} mostlylucid-nmt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 7

      - name: Build summary
        run: |
          echo "### Build: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** ${{ matrix.asset_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ~${{ steps.size.outputs.size_mb }} MB (uncompressed)" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Generate version string
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          mkdir -p release
          # Move archives to release folder with flat structure
          find artifacts -name "*.zip" -exec mv {} release/ \;
          find artifacts -name "*.tar.gz" -exec mv {} release/ \;
          # Generate checksums
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MostlyLucid-NMT v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          body: |
            ## MostlyLucid-NMT v${{ steps.version.outputs.version }}

            Neural machine translation with Opus-MT, mBART50, and M2M100 models.

            ### Downloads (CPU-only, compact builds)

            | Platform | File | Size |
            |----------|------|------|
            | Windows | `mostlylucid-nmt-windows-x64.zip` | ~150MB |
            | Linux | `mostlylucid-nmt-linux-x64.tar.gz` | ~150MB |
            | macOS | `mostlylucid-nmt-macos-x64.tar.gz` | ~150MB |

            These are **CPU-only** builds for portability and small size. For **GPU acceleration**, use Docker (see below).

            ### Quick Start

            ```bash
            # Extract
            tar -xzf mostlylucid-nmt-linux-x64.tar.gz  # Linux/macOS
            # Or unzip on Windows

            cd mostlylucid-nmt

            # Translate directly
            ./mostlylucid-nmt translate "Hello world" --to de

            # Or start server for faster batch processing
            ./mostlylucid-nmt server
            ```

            ### CLI Commands

            ```bash
            translate "text" --to de    # Direct translation (loads model)
            server                       # Start HTTP server
            server --background          # Run in background
            languages                    # List supported languages
            status                       # Check server status
            ```

            ### GPU Acceleration (Docker)

            For GPU support, use Docker images instead:

            ```bash
            # GPU with CUDA
            docker run --gpus all -p 8000:8000 scottgal/mostlylucid-nmt:gpu

            # CPU Docker (alternative to standalone exe)
            docker run -p 8000:8000 scottgal/mostlylucid-nmt:cpu
            ```

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
