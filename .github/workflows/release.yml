name: Build and Release Executables

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 3.2.0)'
        required: false
        default: 'dev'

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: mostlylucid-nmt-windows-x64.zip
            exe_name: mostlylucid-nmt.exe
          - os: ubuntu-latest
            asset_name: mostlylucid-nmt-linux-x64.tar.gz
            exe_name: mostlylucid-nmt
          - os: macos-latest
            asset_name: mostlylucid-nmt-macos-x64.tar.gz
            exe_name: mostlylucid-nmt

    steps:
      - name: Free disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
            sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
            sudo rm -rf /usr/share/swift /usr/local/share/powershell
            sudo docker image prune --all --force || true
            sudo apt-get clean || true
          fi
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CTranslate2 for smaller size)
        run: |
          python -m pip install --upgrade pip

          # Nuitka for smaller executables
          pip install nuitka ordered-set zstandard

          # CTranslate2 (~20MB) instead of PyTorch (~200MB)
          pip install ctranslate2

          # Install other requirements (transformers for tokenizers only)
          pip install fastapi pydantic uvicorn gunicorn transformers huggingface_hub langdetect sentencepiece sacremoses protobuf httpx tqdm psutil

      - name: Generate version string
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(date -u +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Update version in source
        shell: bash
        run: |
          echo '__version__ = "${{ steps.version.outputs.version }}"' > src/__version__.py

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=mostlylucid-nmt${{ runner.os == 'Windows' && '.exe' || '' }} \
            --include-package=src \
            --include-package=transformers.models.marian \
            --include-package=transformers.models.mbart \
            --include-package=transformers.models.m2m_100 \
            --include-package-data=langdetect \
            --include-distribution-metadata=sacremoses \
            --include-distribution-metadata=sentencepiece \
            --include-distribution-metadata=tokenizers \
            --include-distribution-metadata=transformers \
            --include-distribution-metadata=huggingface-hub \
            --include-distribution-metadata=ctranslate2 \
            --nofollow-import-to=torch.cuda \
            --nofollow-import-to=torch.distributed \
            --nofollow-import-to=triton \
            --nofollow-import-to=tensorflow \
            --nofollow-import-to=jax \
            --nofollow-import-to=pytest \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=IPython \
            run_server.py

      - name: Find and move executable
        id: find_exe
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            find . -name "mostlylucid-nmt.exe" -type f | head -1 | xargs -I {} mv {} dist/
            echo "exe_path=dist/mostlylucid-nmt.exe" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" == "macOS" ]; then
            # macOS BSD find doesn't support -executable, use -perm +111 instead
            find . -name "mostlylucid-nmt" -type f -perm +111 | head -1 | xargs -I {} mv {} dist/
            echo "exe_path=dist/mostlylucid-nmt" >> $GITHUB_OUTPUT
          else
            # Linux GNU find supports -executable
            find . -name "mostlylucid-nmt" -type f -executable | head -1 | xargs -I {} mv {} dist/
            echo "exe_path=dist/mostlylucid-nmt" >> $GITHUB_OUTPUT
          fi
          ls -la dist/

      - name: Test executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./dist/mostlylucid-nmt.exe --version || echo "Version check done"
          else
            chmod +x ./dist/mostlylucid-nmt
            ./dist/mostlylucid-nmt --version || echo "Version check done"
          fi

      - name: Get build size
        id: size
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            SIZE=$(du -sm dist/mostlylucid-nmt.exe | cut -f1)
          else
            SIZE=$(du -sm dist/mostlylucid-nmt | cut -f1)
          fi
          echo "size_mb=${SIZE}" >> $GITHUB_OUTPUT
          echo "Build size: ${SIZE} MB"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/mostlylucid-nmt${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7

      - name: Build summary
        run: |
          echo "### Build: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** ${{ matrix.asset_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ~${{ steps.size.outputs.size_mb }} MB (uncompressed)" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Run on tag pushes OR manual dispatch with non-dev version
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'dev')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls | head -50

      - name: Generate version string
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(date -u +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Creating release for version: ${VERSION}"

      - name: Prepare release files
        run: |
          mkdir -p release

          # Copy executables with proper names
          if [ -d "artifacts/build-windows-latest" ]; then
            cp artifacts/build-windows-latest/mostlylucid-nmt.exe release/mostlylucid-nmt-windows-x64.exe
          fi

          if [ -d "artifacts/build-ubuntu-latest" ]; then
            cp artifacts/build-ubuntu-latest/mostlylucid-nmt release/mostlylucid-nmt-linux-x64
            chmod +x release/mostlylucid-nmt-linux-x64
          fi

          if [ -d "artifacts/build-macos-latest" ]; then
            cp artifacts/build-macos-latest/mostlylucid-nmt release/mostlylucid-nmt-macos-x64
            chmod +x release/mostlylucid-nmt-macos-x64
          fi

          # Generate checksums
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MostlyLucid-NMT v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          body: |
            ## MostlyLucid-NMT v${{ steps.version.outputs.version }}

            Neural machine translation with Opus-MT, mBART50, and M2M100 models.

            ### Downloads (CPU-only, single executable)

            | Platform | File |
            |----------|------|
            | Windows | `mostlylucid-nmt-windows-x64.exe` |
            | Linux | `mostlylucid-nmt-linux-x64` |
            | macOS | `mostlylucid-nmt-macos-x64` |

            Single binary, no extraction needed. **CPU-only** for portability. For **GPU**, use Docker.

            ### Quick Start

            ```bash
            # Download and run directly
            chmod +x mostlylucid-nmt-linux-x64  # Linux/macOS only
            ./mostlylucid-nmt-linux-x64 translate "Hello world" --to de

            # Or start server
            ./mostlylucid-nmt-linux-x64 server
            ```

            ### CLI Commands

            ```bash
            translate "text" --to de    # Direct translation (loads model)
            server                       # Start HTTP server
            server --background          # Run in background
            languages                    # List supported languages
            status                       # Check server status
            ```

            ### GPU Acceleration (Docker)

            For GPU support, use Docker images instead:

            ```bash
            # GPU with CUDA
            docker run --gpus all -p 8000:8000 scottgal/mostlylucid-nmt:gpu

            # CPU Docker (alternative to standalone exe)
            docker run -p 8000:8000 scottgal/mostlylucid-nmt:cpu
            ```

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
